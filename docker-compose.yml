services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mars-rag-db
    environment:
      POSTGRES_DB: marsrag
      POSTGRES_USER: marsrag
      POSTGRES_PASSWORD: marsrag_dev_password
    ports:
      - "5432:5432"
    volumes:
      - marsrag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marsrag -d marsrag"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "marsrag.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - .:/app

volumes:
  marsrag_pgdata:
