[project]
name = "mars-rag"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "python-dotenv>=1,<2", "psycopg[binary,pool]>=3.2,<4", "pgvector>=0.3,<1", "langchain>=0.3,<2", "langchain-openai>=0.2,<2", "langgraph>=0.2,<2", "openai>=1.50,<3", "tiktoken>=0.8,<1", "tenacity>=9,<10", "structlog>=24.4,<26", "PyMuPDF>=1.24,<2", "pdfplumber>=0.11,<1", "pytesseract>=0.3.13,<1", "Pillow>=10,<13"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.7,<1"]
ui = ["streamlit>=1.39,<2", "requests>=2.32,<3"]
[tool.uv]
package = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.hatch.build.targets.wheel]
packages = ["src/marsrag"]
